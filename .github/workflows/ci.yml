name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # pnpm/action-setup@v6.0.9 — installs the pnpm version from packageManager
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      # actions/setup-node@v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm

      # Socket Firewall (free) — screens every package download for malicious
      # packages. Installed unwrapped (bootstrap), then used to wrap the install.
      - name: Install Socket Firewall
        run: npm install -g sfw@2.0.6

      - name: Install dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
